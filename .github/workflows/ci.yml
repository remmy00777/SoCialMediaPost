name: ci
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -e 'backend[dev]'
      - run: cd backend && ruff check app tests && mypy app && PYTHONPATH=. pytest
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: cd frontend && npm install --omit=optional && npm run lint && npm run typecheck && npm run build
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && printf '\nPOSTGRES_PASSWORD=ci-password\n' >> .env
      - run: docker compose build api worker beat
